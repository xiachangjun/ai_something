<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍸 COCKTAIL RECIPES</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --px-bg:        #1a1a2e;
  --px-surface:   #16213e;
  --px-card:      #0f3460;
  --px-accent:    #e94560;
  --px-pink:      #ff6b9d;
  --px-gold:      #ffd700;
  --px-green:     #4ade80;
  --px-cyan:      #22d3ee;
  --px-text:      #e8e8e8;
  --px-dim:       #8892a0;
  --px-border:    #2a2a4a;
  --px-font:      'Press Start 2P', monospace;
}

body {
  background: var(--px-bg);
  background-image:
    radial-gradient(circle at 20% 30%, rgba(233,69,96,0.06) 0%, transparent 60%),
    radial-gradient(circle at 80% 70%, rgba(34,211,238,0.06) 0%, transparent 60%),
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 4px);
  color: var(--px-text);
  font-family: var(--px-font);
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 14px 60px;
}

body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
  z-index: 9999;
}

.title { text-align: center; margin-bottom: 28px; width: 100%; max-width: 800px; }
.title h1 { font-size: 22px; color: var(--px-accent); text-shadow: 2px 2px 0 rgba(0,0,0,0.5); letter-spacing: 3px; margin-bottom: 6px; }
.title p { font-size: 11px; color: var(--px-dim); letter-spacing: 2px; }

.search-area { width: 100%; max-width: 800px; margin-bottom: 20px; }
.px-input {
  font-family: var(--px-font); font-size: 13px; padding: 12px 16px;
  background: #0a0a1a; border: 2px solid var(--px-border);
  color: var(--px-cyan); outline: none; width: 100%;
  transition: border-color 0.1s step-start; letter-spacing: 0.5px;
}
.px-input:focus { border-color: var(--px-cyan); box-shadow: 0 0 12px rgba(34,211,238,0.2); }
.px-input::placeholder { color: #3a3a5a; }

.tags { width: 100%; max-width: 800px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.px-tag {
  font-family: var(--px-font); font-size: 10px; padding: 8px 14px;
  border: 2px solid var(--px-border); background: var(--px-card);
  color: var(--px-dim); cursor: pointer; transition: all 0.1s step-start;
  letter-spacing: 1px;
}
.px-tag:hover { border-color: var(--px-cyan); color: var(--px-cyan); }
.px-tag.active { background: var(--px-accent); border-color: var(--px-pink); color: #fff; }

.grid { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 18px; }

.px-box {
  background: var(--px-surface); border: 3px solid var(--px-border);
  padding: 24px 22px;
  box-shadow: inset 0 0 0 1px rgba(233,69,96,0.08), 4px 4px 0 rgba(0,0,0,0.4);
  position: relative; animation: cardIn 0.3s step-start;
}
.px-box::before {
  content: ''; position: absolute; top: -3px; left: -3px; right: -3px; height: 3px;
  background: linear-gradient(90deg, var(--px-accent), var(--px-cyan), var(--px-gold));
}
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.px-box h2 { font-size: 16px; color: var(--px-gold); letter-spacing: 1px; margin-bottom: 10px; }
.px-box .meta { font-size: 10px; color: var(--px-dim); letter-spacing: 0.5px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--px-border); }
.px-box .meta .label { color: var(--px-cyan); }
.px-box .section-label { font-size: 11px; color: var(--px-accent); letter-spacing: 1px; margin-bottom: 8px; margin-top: 12px; }
.px-box .ingredients { list-style: none; padding: 0; margin-bottom: 8px; }
.px-box .ingredients li { font-size: 11px; color: var(--px-text); letter-spacing: 0.5px; line-height: 2.2; padding-left: 14px; position: relative; }
.px-box .ingredients li::before { content: '▸'; position: absolute; left: 0; color: var(--px-cyan); }
.px-box .instructions { font-size: 11px; color: var(--px-dim); letter-spacing: 0.5px; line-height: 2.2; margin-top: 4px; }
.px-box .difficulty { display: inline-block; font-size: 10px; color: var(--px-gold); letter-spacing: 1px; margin-left: 8px; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--px-dim); font-size: 13px; letter-spacing: 1px; line-height: 2; }

.back-link { font-size: 11px; color: var(--px-cyan); text-decoration: none; letter-spacing: 1px; margin-bottom: 20px; display: inline-block; width: 100%; max-width: 800px; }
.back-link:hover { color: var(--px-gold); }

footer { margin-top: 40px; font-size: 9px; color: #3a3a5a; letter-spacing: 1px; text-align: center; }

@media (max-width: 480px) {
  .title h1 { font-size: 17px; }
  .px-box { padding: 16px 14px; }
  body { padding: 20px 10px 40px; font-size: 12px; }
  .px-box h2 { font-size: 14px; }
  .px-box .ingredients li, .px-box .instructions { font-size: 10px; }
}
</style>
</head>
<body>

<a class="back-link" href="/">◂ BACK TO TOOLSHED</a>

<div class="tags" id="tagContainer">

<div class="grid" id="recipeGrid"></div>

<div class="empty-state" id="emptyState" style="display:none;">

</div>

<footer>✦ 2026 · 像素工坊 ✦</footer>

  { name:"黛绮莉之花", en:"Floridita Daiquiri", base:"朗姆酒", glass:"鸡尾酒杯", abv:"20%", difficulty:"★★☆", tags:"朗姆酒",
    ingredients:["白朗姆酒 45ml","青柠汁 20ml","黑樱桃利口酒 10ml","单糖浆 10ml","樱桃（装饰）"],
    steps:"将所有原料加冰摇荡10秒。双重滤入冰镇鸡尾酒杯。樱桃装饰。" },
  { name:"自由古巴", en:"Cuba Libre", base:"朗姆酒", glass:"海波杯", abv:"12%", difficulty:"★☆☆", tags:"朗姆酒",
    ingredients:["白朗姆酒 50ml","可乐 120ml","青柠角 1个","冰块"],
    steps:"海波杯加满冰。挤入青柠角后投入杯中。倒入朗姆酒，可乐补满。轻轻搅拌。" },
];

let currentTag = 'all';

function renderRecipes(data) {
  const grid = document.getElementById('recipeGrid');
  const empty = document.getElementById('emptyState');
  if (data.length === 0) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = data.map(r => `
    <div class="px-box">
      <h2>${r.name} <span style="font-size:10px;color:var(--px-dim);letter-spacing:0.5px;">${r.en}</span></h2>
      <div class="meta">
        <span class="label">🍸</span> ${r.glass} &nbsp;|&nbsp; <span class="label">🔞</span> ${r.abv}
        <span class="difficulty">${r.difficulty}</span>
      </div>
      <div class="section-label">▸ INGREDIENTS</div>
      <ul class="ingredients">${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
      <div class="section-label">▸ INSTRUCTIONS</div>
      <div class="instructions">${r.steps}</div>
    </div>
  `).join('');
}

function filterRecipes() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = recipes;
  if (currentTag !== 'all') filtered = filtered.filter(r => r.tags && r.tags.includes(currentTag));
  if (q) {
    filtered = filtered.filter(r =>
      r.name.toLowerCase().includes(q) || r.en.toLowerCase().includes(q) ||
      r.base.toLowerCase().includes(q) || r.ingredients.some(i => i.toLowerCase().includes(q))
    );
  }
  renderRecipes(filtered);
}

function filterByTag(tag) {
  currentTag = tag;
  document.querySelectorAll('.px-tag').forEach(b => b.classList.toggle('active', b.textContent === (tag === 'all' ? '全部' : tag)));
  filterRecipes();
}

renderRecipes(recipes);
</script>
