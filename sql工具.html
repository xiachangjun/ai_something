<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 工具</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

:root {
  --ink: #2c2c2c;
  --paper: #fffef5;
  --red: #ff6b6b;
  --teal: #4ecdc4;
  --yellow: #ffd93d;
  --font: "ZCOOL KuaiLe", "Patrick Hand", "PingFang SC", sans-serif;
  --hand: "Patrick Hand", "ZCOOL KuaiLe", sans-serif;
  --code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

html { color-scheme: light; }

body {
  min-height: 100vh;
  background-color: var(--paper);
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 31px,
    #4ecdc4 31px,
    #4ecdc4 32px
  );
  color: var(--ink);
  font-family: var(--font);
  font-weight: 700;
  line-height: 1.4;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  bottom: 0;
  left: 28px;
  border-left: 2px dashed var(--red);
  pointer-events: none;
  z-index: 2;
}

::selection { background: var(--yellow); color: var(--ink); }
:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }

.page {
  position: relative;
  z-index: 1;
  width: min(1100px, 100%);
  margin: 0 auto;
  padding: 20px 16px 56px 48px;
}

.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin-bottom: 18px;
}

h1 {
  font-size: clamp(2rem, 5vw, 3.2rem);
  line-height: 1.05;
  background: var(--yellow);
  padding: 0 0.12em;
  transform: rotate(-1.2deg);
}

.jump {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-left: auto;
}

.btn, .chip, .jump a {
  border-radius: 2px;
  border: 2px dashed var(--ink);
  font-family: var(--font);
  font-weight: 700;
  color: var(--ink);
  background: var(--paper);
  box-shadow: 3px 3px 0 var(--teal);
  cursor: pointer;
  text-decoration: none;
  transition: box-shadow 200ms ease-in-out, transform 200ms ease-in-out, background 200ms ease-in-out;
}

.btn {
  min-height: 40px;
  padding: 6px 12px;
}
.btn.ink { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--red); }
.btn.red { background: var(--red); }
.btn.yellow { background: var(--yellow); }
.btn:hover { transform: translate(1px, 1px) rotate(-1.4deg); box-shadow: 5px 5px 0 var(--teal); }
.btn.ink:hover { box-shadow: 5px 5px 0 var(--red); }
.btn:active { transform: translate(2px, 2px) scale(0.98); box-shadow: none; }
.btn:focus-visible { box-shadow: 2px 2px 0 var(--yellow); }

.jump a {
  min-height: 36px;
  padding: 4px 10px;
  display: inline-flex;
  align-items: center;
}
.jump a:hover { background: var(--yellow); }

.bench {
  position: relative;
  margin-bottom: 22px;
  padding: 18px 16px 16px;
  background: var(--paper);
  border: 2px dashed var(--ink);
  border-radius: 2px;
  box-shadow: 4px 4px 0 var(--teal);
  transform: rotate(-0.35deg);
}
.bench:nth-of-type(2) { transform: rotate(0.4deg); box-shadow: 4px 4px 0 var(--red); }
.bench:nth-of-type(3) { transform: rotate(-0.2deg); }

.bench h2 {
  font-size: clamp(1.4rem, 3vw, 1.9rem);
  margin-bottom: 12px;
}

.options {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.options input {
  width: 18px;
  height: 18px;
  accent-color: var(--red);
}

label.field { display: block; margin-bottom: 6px; }
.hint { font-family: var(--hand); font-weight: 400; font-size: 0.95rem; }

textarea {
  width: 100%;
  min-height: 180px;
  padding: 10px;
  border: 2px dashed var(--ink);
  border-radius: 2px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--code);
  font-size: 14px;
  line-height: 1.45;
  resize: vertical;
}
textarea::placeholder { color: #5c5346; opacity: 1; }
textarea:focus {
  outline: none;
  border-color: var(--red);
  box-shadow: 2px 2px 0 var(--yellow);
}
#sqlInput { min-height: 220px; }
#resultArea, #stringInput, #stringOutput, #jsonInput, #jsonResultArea { min-height: 220px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }

.stats {
  font-family: var(--hand);
  font-weight: 400;
  font-size: 1rem;
  margin: 6px 0 10px;
  padding: 4px 8px;
  background: var(--yellow);
  border: 2px dashed var(--ink);
  border-radius: 2px;
  align-self: flex-start;
  display: inline-block;
}

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.chip { padding: 6px 10px; min-height: 36px; }
.chip:hover, .chip.is-on { background: var(--yellow); }

.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.crumb {
  font-family: var(--hand);
  font-weight: 400;
  min-height: 1.4em;
  margin: 8px 0;
}
.crumb button {
  border: 0;
  background: none;
  font: inherit;
  color: var(--ink);
  text-decoration: underline;
  text-decoration-style: wavy;
  text-decoration-color: var(--red);
  cursor: pointer;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 5;
  padding: 10px 14px;
  border: 2px dashed var(--ink);
  border-radius: 2px;
  background: var(--yellow);
  color: var(--ink);
  font-weight: 700;
  box-shadow: 3px 3px 0 var(--teal);
  opacity: 0;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.err { background: var(--red); }

dialog {
  margin: auto;
  border: 2px dashed var(--ink);
  border-radius: 2px;
  background: var(--paper);
  color: var(--ink);
  padding: 22px 20px;
  max-width: 520px;
  width: calc(100% - 32px);
  box-shadow: 6px 6px 0 var(--teal);
}
dialog::backdrop { background: rgb(44 44 44 / 0.35); }
dialog h3 { font-size: 1.4rem; margin-bottom: 10px; }
dialog ul { margin: 0 0 14px 1.1em; font-family: var(--hand); font-weight: 400; }
dialog li { margin: 6px 0; }
kbd {
  border: 2px dashed var(--ink);
  border-radius: 2px;
  background: var(--yellow);
  padding: 0 6px;
  font-family: var(--font);
}

@media (max-width: 800px) {
  body::before { left: 16px; }
  .page { padding: 14px 12px 48px 32px; }
  .split { grid-template-columns: 1fr; }
  .jump { margin-left: 0; width: 100%; }
  textarea, #sqlInput, #resultArea, #stringInput, #stringOutput, #jsonInput, #jsonResultArea { min-height: 140px; }
}

@media (prefers-reduced-motion: reduce) {
  .btn, .btn:hover, .btn:active { transition: none; transform: none; }
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <a class="btn ink" href="index.html">返回</a>
    <h1>SQL 工具</h1>
    <nav class="jump" aria-label="分区">
      <a href="#sql">SQL</a>
      <a href="#str">字符串</a>
      <a href="#json">JSON</a>
      <button class="btn yellow" type="button" id="helpBtn">快捷键</button>
    </nav>
  </div>

  <section class="bench" id="sql">
    <h2>SQL</h2>
    <label class="options">
      <input type="checkbox" id="autoFormat" checked>
      JSON 格式化
    </label>
    <label class="field" for="sqlInput">输入 <span class="hint">Ctrl+Enter 解析</span></label>
    <textarea id="sqlInput" placeholder="INSERT INTO t (id, title) VALUES (1, 'a');"></textarea>
    <div class="actions">
      <button class="btn ink" type="button" data-act="parse-sql">解析</button>
      <button class="btn red" type="button" data-act="clear-sql-in">清空输入</button>
    </div>
    <p class="stats" id="sqlStats" hidden></p>
    <div class="chips" id="columnList"></div>
    <label class="field" for="resultArea">结果</label>
    <textarea id="resultArea" readonly placeholder="点字段名抽出这一列"></textarea>
    <div class="actions">
      <button class="btn" type="button" data-act="copy-sql">复制</button>
      <button class="btn" type="button" data-act="dedup-sql">去重</button>
      <button class="btn yellow" type="button" data-act="export-sql">导出</button>
      <button class="btn red" type="button" data-act="clear-sql-out">清空结果</button>
    </div>
    <p class="stats" id="resultStats" hidden></p>
  </section>

  <section class="bench" id="str">
    <h2>字符串</h2>
    <label class="options">
      <input type="checkbox" id="addQuotes">
      加引号
    </label>
    <div class="split">
      <div>
        <label class="field" for="stringInput">输入 <span class="hint">每行一项 · Ctrl+Enter</span></label>
        <textarea id="stringInput" placeholder="apple&#10;banana"></textarea>
        <div class="actions">
          <button class="btn ink" type="button" data-act="process-str">处理</button>
          <button class="btn red" type="button" data-act="clear-str-in">清空输入</button>
        </div>
        <p class="stats" id="stringInputStats" hidden></p>
      </div>
      <div>
        <label class="field" for="stringOutput">输出</label>
        <textarea id="stringOutput" readonly placeholder="apple,banana"></textarea>
        <div class="actions">
          <button class="btn" type="button" data-act="copy-str">复制</button>
          <button class="btn" type="button" data-act="dedup-str">去重</button>
          <button class="btn yellow" type="button" data-act="export-str">导出</button>
          <button class="btn red" type="button" data-act="clear-str-out">清空输出</button>
        </div>
        <p class="stats" id="stringOutputStats" hidden></p>
      </div>
    </div>
  </section>

  <section class="bench" id="json">
    <h2>JSON</h2>
    <label class="options">
      <input type="checkbox" id="jsonAutoFormat" checked>
      JSON 格式化
    </label>
    <label class="field" for="jsonInput">输入 <span class="hint">Ctrl+Enter 解析</span></label>
    <textarea id="jsonInput" placeholder='[{"name":"张三","address":{"city":"北京"}}]'></textarea>
    <div class="actions">
      <button class="btn ink" type="button" data-act="parse-json">解析</button>
      <button class="btn" type="button" data-act="reset-json" id="resetButton" hidden>重置</button>
      <button class="btn red" type="button" data-act="clear-json-in">清空输入</button>
    </div>
    <p class="stats" id="jsonStats" hidden></p>
    <p class="crumb" id="jsonBreadcrumb"></p>
    <div class="chips" id="jsonColumnList"></div>
    <label class="field" for="jsonResultArea">结果</label>
    <textarea id="jsonResultArea" readonly placeholder="点字段名抽出这一列"></textarea>
    <div class="actions">
      <button class="btn" type="button" data-act="copy-json">复制</button>
      <button class="btn" type="button" data-act="dedup-json">去重</button>
      <button class="btn ink" type="button" data-act="continue-json" id="continueButton" hidden>继续解析</button>
      <button class="btn yellow" type="button" data-act="export-json">导出</button>
      <button class="btn red" type="button" data-act="clear-json-out">清空结果</button>
    </div>
    <p class="stats" id="jsonResultStats" hidden></p>
  </section>
</div>

<p class="toast" id="toast" role="status"></p>

<dialog id="helpDialog" aria-labelledby="helpTitle">
  <h3 id="helpTitle">快捷键</h3>
  <ul>
    <li><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 解析 / 处理</li>
    <li><kbd>Ctrl</kbd> + <kbd>K</kbd> 清空全部</li>
    <li><kbd>?</kbd> 打开或关闭本说明</li>
    <li><kbd>Esc</kbd> 关闭</li>
  </ul>
  <p class="hint">SQL 抽出一列；字符串按行拼成逗号列表；JSON 可点「继续解析」往里走。</p>
  <form method="dialog" style="margin-top:14px"><button class="btn ink" value="close">关闭</button></form>
</dialog>

<script>
(function () {
  var sqlRows = [];
  var jsonRows = [];
  var jsonRoot = null;
  var jsonPath = [];
  var lastField = '';
  var lastValues = [];
  var toastTimer = 0;

  function $(id) { return document.getElementById(id); }
  function toast(msg, err) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.toggle('err', !!err);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove('show');
      el.textContent = '';
    }, 1800);
  }
  function setStats(id, lines, chars) {
    var el = $(id);
    el.hidden = false;
    el.textContent = lines + ' 行 · ' + chars + ' 字';
  }
  function hideStats(id) { $(id).hidden = true; }
  function copyFrom(id) {
    var text = $(id).value;
    if (!text.trim()) { toast('没有内容', true); return; }
    navigator.clipboard.writeText(text).then(function () { toast('已复制'); }, function () {
      $(id).select();
      document.execCommand('copy');
      toast('已复制');
    });
  }
  function exportText(text, prefix) {
    if (!String(text).trim()) { toast('没有内容', true); return; }
    var stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = prefix + '_' + stamp + '.txt';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
    toast('已导出');
  }
  function uniqueLines(id, statsId) {
    var el = $(id);
    var text = el.value;
    if (!text.trim()) { toast('没有内容', true); return; }
    var lines = text.split('\n');
    var uniq = Array.from(new Set(lines));
    if (lines.length === uniq.length) { toast('没有重复'); return; }
    var next = uniq.join('\n');
    el.value = next;
    setStats(statsId, uniq.length, next.length);
    toast('去掉 ' + (lines.length - uniq.length) + ' 行');
  }
  function fieldsOf(rows) {
    var set = {};
    rows.forEach(function (row) {
      if (row && typeof row === 'object') Object.keys(row).forEach(function (key) { set[key] = true; });
    });
    return Object.keys(set);
  }
  function fillChips(container, names, onPick) {
    container.replaceChildren();
    names.forEach(function (name) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip';
      btn.textContent = name;
      btn.addEventListener('click', function () {
        Array.prototype.forEach.call(container.children, function (el) { el.classList.remove('is-on'); });
        btn.classList.add('is-on');
        onPick(name);
      });
      container.appendChild(btn);
    });
  }

  function processValue(value) {
    var quoted = (value.charAt(0) === "'" && value.slice(-1) === "'") ||
      (value.charAt(0) === '"' && value.slice(-1) === '"');
    if (quoted) {
      var q = value.charAt(0);
      value = value.slice(1, -1)
        .replace(new RegExp(q + q, 'g'), q)
        .replace(/\\'/g, "'")
        .replace(/\\"/g, '"')
        .replace(/\\\\/g, '\\');
    }
    if ($('autoFormat').checked) {
      try { return JSON.stringify(JSON.parse(value), null, 2); } catch (err) { return value; }
    }
    return value;
  }
  function parseValues(valueStr) {
    var values = [];
    var current = '';
    var inString = false;
    var quoteChar = null;
    var depth = 0;
    var escape = false;
    var i, ch;
    for (i = 0; i < valueStr.length; i++) {
      ch = valueStr.charAt(i);
      if (escape) { current += ch; escape = false; continue; }
      if (ch === '\\') { escape = true; current += ch; continue; }
      if (!inString) {
        if (ch === '{' || ch === '[') depth += 1;
        if (ch === '}' || ch === ']') depth -= 1;
      }
      if ((ch === "'" || ch === '"') && !inString) { inString = true; quoteChar = ch; }
      else if (ch === quoteChar && inString) inString = false;
      if (ch === ',' && !inString && depth === 0) {
        values.push(processValue(current.trim()));
        current = '';
        continue;
      }
      current += ch;
    }
    values.push(processValue(current.trim()));
    return values;
  }
  function parseSQL() {
    var sql = $('sqlInput').value;
    sqlRows = [];
    var insertPattern = /INSERT\s+INTO\s+(?:`?([\w.]+)`?\.)?`?([\w.]+)`?\s*\(([^)]+)\)\s*VALUES\s*\(([^)]+)\)/gi;
    var columnMatch = sql.split(';')[0].match(/INSERT\s+INTO\s+(?:`?([\w.]+)`?\.)?`?([\w.]+)`?\s*\(([^)]+)\)/i);
    if (!columnMatch) { toast('SQL 看不懂', true); return; }
    var columns = columnMatch[3].split(',').map(function (c) { return c.trim().replace(/^`|`$/g, ''); });
    var match;
    while ((match = insertPattern.exec(sql)) !== null) {
      var rowValues = parseValues(match[4]);
      var row = {};
      columns.forEach(function (col, i) { row[col] = rowValues[i] == null ? null : rowValues[i]; });
      sqlRows.push(row);
    }
    if (!sqlRows.length) { toast('没有数据行', true); return; }
    fillChips($('columnList'), columns, function (col) {
      var values = sqlRows.map(function (row) { return row[col]; });
      var text = values.join('\n');
      $('resultArea').value = text;
      setStats('resultStats', values.length, text.length);
    });
    toast('解析 ' + sqlRows.length + ' 行');
  }
  function clearSQLInput() {
    $('sqlInput').value = '';
    $('columnList').replaceChildren();
    $('resultArea').value = '';
    hideStats('sqlStats');
    hideStats('resultStats');
    sqlRows = [];
    toast('已清空');
  }

  function processText() {
    var raw = $('stringInput').value;
    if (!raw.trim()) { toast('先输入', true); return; }
    var quoted = $('addQuotes').checked;
    var lines = raw.split(/\r?\n/).map(function (line) { return line.trim(); }).filter(Boolean);
    var result = lines.map(function (line) { return quoted ? '"' + line + '",' : line + ','; }).join('').replace(/,$/, '');
    $('stringOutput').value = result;
    setStats('stringInputStats', lines.length, raw.length);
    setStats('stringOutputStats', lines.length, result.length);
    toast('处理好了');
  }
  function dedupString() {
    var output = $('stringOutput');
    var text = output.value;
    if (!text.trim()) { toast('没有内容', true); return; }
    var items = text.split(',');
    var original = items.length;
    if (items[items.length - 1] === '') items.pop();
    var hasQuotes = items.some(function (item) {
      var t = item.trim();
      return t.charAt(0) === '"' && t.slice(-1) === '"';
    });
    if (hasQuotes) {
      items = Array.from(new Set(items.map(function (item) { return item.trim().replace(/^"|"$/g, ''); }))).map(function (item) { return '"' + item + '"'; });
    } else {
      items = Array.from(new Set(items.map(function (item) { return item.trim(); })));
    }
    var next = items.join(',');
    output.value = next;
    setStats('stringOutputStats', items.length, next.length);
    toast('去掉 ' + (original - items.length) + ' 项');
  }

  function renderJSONFields(fields) {
    fillChips($('jsonColumnList'), fields, showJSONValues);
  }
  function updateBreadcrumb() {
    var el = $('jsonBreadcrumb');
    el.replaceChildren();
    if (!jsonRoot) { el.textContent = ''; return; }
    el.appendChild(document.createTextNode('路径 '));
    var root = document.createElement('button');
    root.type = 'button';
    root.textContent = '根';
    root.addEventListener('click', function () { backToLevel(-1); });
    el.appendChild(root);
    jsonPath.forEach(function (name, index) {
      el.appendChild(document.createTextNode(' → '));
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = name;
      btn.addEventListener('click', function () { backToLevel(index); });
      el.appendChild(btn);
    });
  }
  function asRows(data) {
    if (Array.isArray(data)) return data;
    if (data && typeof data === 'object') return [data];
    return [];
  }
  function parseJSON() {
    var input = $('jsonInput').value;
    jsonRows = [];
    jsonRoot = null;
    jsonPath = [];
    lastField = '';
    lastValues = [];
    if (!input.trim()) { toast('先输入 JSON', true); return; }
    var parsed;
    try { parsed = JSON.parse(input); }
    catch (err) { toast('JSON 错了：' + err.message, true); return; }
    jsonRoot = parsed;
    jsonRows = asRows(parsed);
    if (!jsonRows.length) { toast('是空的', true); return; }
    var fields = fieldsOf(jsonRows);
    if (!fields.length) { toast('没有字段', true); return; }
    renderJSONFields(fields);
    updateBreadcrumb();
    $('resetButton').hidden = false;
    $('continueButton').hidden = true;
    setStats('jsonStats', jsonRows.length, input.length);
    toast('解析 ' + jsonRows.length + ' 条 · ' + fields.length + ' 字段');
  }
  function showJSONValues(field) {
    lastField = field;
    lastValues = [];
    var nested = false;
    var values = jsonRows.map(function (item) {
      var value = item[field];
      lastValues.push(value);
      if (value && typeof value === 'object') nested = true;
      if ($('jsonAutoFormat').checked && value && typeof value === 'object') {
        try { return JSON.stringify(value, null, 2); } catch (err) { return String(value); }
      }
      if (value === null) return 'null';
      if (value === undefined) return 'undefined';
      return String(value);
    });
    var text = values.join('\n');
    $('jsonResultArea').value = text;
    setStats('jsonResultStats', values.length, text.length);
    $('continueButton').hidden = !nested;
  }
  function continueParseJSON() {
    var valid = lastValues.filter(function (v) { return v && typeof v === 'object'; });
    if (!valid.length) { toast('这列不能再往里走', true); return; }
    var next = [];
    valid.forEach(function (value) {
      if (Array.isArray(value)) next = next.concat(value);
      else next.push(value);
    });
    jsonRows = next;
    jsonPath.push(lastField);
    var fields = fieldsOf(jsonRows);
    if (!fields.length) { toast('没有字段', true); return; }
    renderJSONFields(fields);
    updateBreadcrumb();
    $('jsonResultArea').value = '';
    hideStats('jsonResultStats');
    $('continueButton').hidden = true;
    toast('现在 ' + jsonRows.length + ' 条');
  }
  function walkTo(level) {
    jsonPath = jsonPath.slice(0, level + 1);
    jsonRows = asRows(jsonRoot);
    var i;
    for (i = 0; i <= level; i++) {
      var field = jsonPath[i];
      var values = [];
      jsonRows.forEach(function (item) {
        var value = item[field];
        if (Array.isArray(value)) values.push.apply(values, value);
        else if (value && typeof value === 'object') values.push(value);
      });
      jsonRows = values;
    }
    renderJSONFields(fieldsOf(jsonRows));
    updateBreadcrumb();
    $('jsonResultArea').value = '';
    hideStats('jsonResultStats');
    $('continueButton').hidden = true;
  }
  function backToLevel(level) {
    if (level < 0) { resetJSON(); return; }
    walkTo(level);
  }
  function resetJSON() {
    if (!jsonRoot) return;
    jsonPath = [];
    lastField = '';
    lastValues = [];
    jsonRows = asRows(jsonRoot);
    renderJSONFields(fieldsOf(jsonRows));
    updateBreadcrumb();
    $('jsonResultArea').value = '';
    hideStats('jsonResultStats');
    $('continueButton').hidden = true;
    toast('回到根');
  }
  function clearJSONInput() {
    $('jsonInput').value = '';
    $('jsonColumnList').replaceChildren();
    $('jsonResultArea').value = '';
    $('jsonBreadcrumb').replaceChildren();
    $('resetButton').hidden = true;
    $('continueButton').hidden = true;
    hideStats('jsonStats');
    hideStats('jsonResultStats');
    jsonRows = [];
    jsonRoot = null;
    jsonPath = [];
    lastField = '';
    lastValues = [];
    toast('已清空');
  }

  var acts = {
    'parse-sql': parseSQL,
    'clear-sql-in': clearSQLInput,
    'copy-sql': function () { copyFrom('resultArea'); },
    'dedup-sql': function () { uniqueLines('resultArea', 'resultStats'); },
    'export-sql': function () { exportText($('resultArea').value, 'sql'); },
    'clear-sql-out': function () { $('resultArea').value = ''; hideStats('resultStats'); toast('已清空'); },
    'process-str': processText,
    'clear-str-in': function () { $('stringInput').value = ''; hideStats('stringInputStats'); toast('已清空'); },
    'copy-str': function () { copyFrom('stringOutput'); },
    'dedup-str': dedupString,
    'export-str': function () { exportText($('stringOutput').value, 'string'); },
    'clear-str-out': function () { $('stringOutput').value = ''; hideStats('stringOutputStats'); toast('已清空'); },
    'parse-json': parseJSON,
    'reset-json': resetJSON,
    'clear-json-in': clearJSONInput,
    'copy-json': function () { copyFrom('jsonResultArea'); },
    'dedup-json': function () { uniqueLines('jsonResultArea', 'jsonResultStats'); },
    'continue-json': continueParseJSON,
    'export-json': function () { exportText($('jsonResultArea').value, 'json'); },
    'clear-json-out': function () { $('jsonResultArea').value = ''; hideStats('jsonResultStats'); $('continueButton').hidden = true; toast('已清空'); }
  };

  document.addEventListener('click', function (event) {
    var btn = event.target.closest('[data-act]');
    if (!btn) return;
    var fn = acts[btn.getAttribute('data-act')];
    if (fn) fn();
  });

  function bindEnter(id, fn) {
    $(id).addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter') { event.preventDefault(); fn(); }
    });
  }
  bindEnter('sqlInput', parseSQL);
  bindEnter('stringInput', processText);
  bindEnter('jsonInput', parseJSON);

  var statMap = { sqlInput: 'sqlStats', stringInput: 'stringInputStats', jsonInput: 'jsonStats' };
  var statTimer = 0;
  Object.keys(statMap).forEach(function (id) {
    $(id).addEventListener('input', function () {
      clearTimeout(statTimer);
      statTimer = setTimeout(function () {
        var text = $(id).value;
        if (!text.trim()) hideStats(statMap[id]);
        else setStats(statMap[id], text.split('\n').length, text.length);
      }, 320);
    });
  });

  var help = $('helpDialog');
  function toggleHelp() { if (help.open) help.close(); else help.showModal(); }
  $('helpBtn').addEventListener('click', toggleHelp);

  document.addEventListener('keydown', function (event) {
    if (event.ctrlKey && event.key === 'k') {
      event.preventDefault();
      clearSQLInput();
      $('stringInput').value = '';
      $('stringOutput').value = '';
      hideStats('stringInputStats');
      hideStats('stringOutputStats');
      clearJSONInput();
      toast('全部清空');
    }
    if (event.key === '?' && !event.ctrlKey && !event.altKey && !event.metaKey) {
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag !== 'TEXTAREA' && tag !== 'INPUT') { event.preventDefault(); toggleHelp(); }
    }
  });
})();
</script>
</body>
</html>
