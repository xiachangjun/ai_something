<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日记录</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap">
<script src="https://cdn.jsdelivr.net/npm/solar2lunar@2.0.5/dist/index.min.js"></script>
<script>window.solar2lunar = window.returnExports;</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

:root {
  --ink: #2c2c2c;
  --paper: #fffef5;
  --red: #ff6b6b;
  --teal: #4ecdc4;
  --yellow: #ffd93d;
  --font: "ZCOOL KuaiLe", "Patrick Hand", "PingFang SC", sans-serif;
  --hand: "Patrick Hand", "ZCOOL KuaiLe", sans-serif;
}

html { color-scheme: light; }

body {
  min-height: 100vh;
  background-color: var(--paper);
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 31px,
    #4ecdc4 31px,
    #4ecdc4 32px
  );
  color: var(--ink);
  font-family: var(--font);
  font-weight: 700;
  line-height: 1.4;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  bottom: 0;
  left: 28px;
  border-left: 2px dashed var(--red);
  pointer-events: none;
  z-index: 2;
}

::selection { background: var(--yellow); color: var(--ink); }
:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }

.page {
  position: relative;
  z-index: 1;
  width: min(720px, 100%);
  margin: 0 auto;
  padding: 20px 16px 56px 48px;
}

.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin-bottom: 18px;
}

h1 {
  font-size: clamp(2rem, 5vw, 3.2rem);
  line-height: 1.05;
  background: var(--yellow);
  padding: 0 0.12em;
  transform: rotate(-1.2deg);
}

.top .grow { margin-left: auto; }

.btn {
  border-radius: 2px;
  border: 2px dashed var(--ink);
  font-family: var(--font);
  font-weight: 700;
  color: var(--ink);
  background: var(--paper);
  box-shadow: 3px 3px 0 var(--teal);
  cursor: pointer;
  text-decoration: none;
  min-height: 40px;
  padding: 6px 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: box-shadow 200ms ease-in-out, transform 200ms ease-in-out, background 200ms ease-in-out;
}
.btn.ink { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--red); }
.btn.red { background: var(--red); }
.btn.yellow { background: var(--yellow); }
.btn:hover { transform: translate(1px, 1px) rotate(-1.4deg); box-shadow: 5px 5px 0 var(--teal); }
.btn.ink:hover { box-shadow: 5px 5px 0 var(--red); }
.btn:active { transform: translate(2px, 2px) scale(0.98); box-shadow: none; }
.btn:focus-visible { box-shadow: 2px 2px 0 var(--yellow); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

.bench {
  margin-bottom: 18px;
  padding: 18px 16px 16px;
  background: var(--paper);
  border: 2px dashed var(--ink);
  border-radius: 2px;
  box-shadow: 4px 4px 0 var(--teal);
}

.gate-box { max-width: 420px; transform: rotate(-0.4deg); }
.gate-box h2 { font-size: 1.3rem; margin-bottom: 12px; }
.hint { font-family: var(--hand); font-weight: 400; font-size: 1rem; margin-bottom: 12px; }

label.field { display: block; margin-bottom: 10px; }
label.field span { display: block; margin-bottom: 6px; }

input[type="password"],
input[type="text"],
input[type="date"] {
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  border: 2px dashed var(--ink);
  border-radius: 2px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 1rem;
  font-weight: 700;
}
input::placeholder { color: #5c5346; opacity: 1; }
input:focus {
  outline: none;
  border-color: var(--red);
  box-shadow: 2px 2px 0 var(--yellow);
}

.err {
  min-height: 1.3em;
  margin-top: 10px;
  color: var(--ink);
  background: var(--red);
  padding: 4px 8px;
  border: 2px dashed var(--ink);
  border-radius: 2px;
}
.err:empty { display: none; }

.types { display: flex; gap: 8px; margin-bottom: 12px; }
.types .btn { flex: 1; }
.types .btn.is-on { background: var(--yellow); }

.preview {
  font-family: var(--hand);
  font-weight: 400;
  margin: 0 0 12px;
  padding: 8px 10px;
  background: var(--yellow);
  border: 2px dashed var(--ink);
  border-radius: 2px;
}

.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 12px; }

.list { display: flex; flex-direction: column; gap: 14px; }

.note {
  position: relative;
  padding: 16px 14px 14px;
  background: var(--paper);
  border: 2px dashed var(--ink);
  border-radius: 2px;
  box-shadow: 3px 3px 0 var(--teal);
  transform: rotate(-0.5deg);
}
.note:nth-child(even) { transform: rotate(0.6deg); box-shadow: 3px 3px 0 var(--red); }
.note:nth-child(3n) { transform: rotate(-0.2deg); }
.note h3 { font-size: 1.45rem; margin-bottom: 6px; padding-right: 72px; }
.note .dates {
  font-family: var(--hand);
  font-weight: 400;
  font-size: 1.05rem;
  margin-bottom: 8px;
}
.note .countdown { font-size: 1.05rem; }
.note .countdown.today {
  display: inline-block;
  background: var(--yellow);
  padding: 0 0.2em;
}
.note .countdown.past { font-family: var(--hand); font-weight: 400; }
.note .del { position: absolute; top: 10px; right: 10px; min-height: 34px; padding: 4px 10px; }

.bar {
  margin-top: 10px;
  height: 10px;
  border: 2px dashed var(--ink);
  border-radius: 2px;
  background: var(--paper);
}
.bar i {
  display: block;
  height: 100%;
  background: var(--teal);
}

.empty, .loading {
  padding: 28px 16px;
  text-align: center;
  font-family: var(--hand);
  font-weight: 400;
  font-size: 1.15rem;
  border: 2px dashed var(--ink);
  border-radius: 2px;
  background: var(--paper);
  box-shadow: 3px 3px 0 var(--yellow);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 5;
  padding: 10px 14px;
  border: 2px dashed var(--ink);
  border-radius: 2px;
  background: var(--yellow);
  color: var(--ink);
  font-weight: 700;
  box-shadow: 3px 3px 0 var(--teal);
  opacity: 0;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.err { background: var(--red); }

@media (max-width: 640px) {
  body::before { left: 16px; }
  .page { padding: 14px 12px 48px 32px; }
  .top .grow { margin-left: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .btn, .btn:hover, .btn:active { transition: none; transform: none; }
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <a class="btn ink" href="index.html">返回</a>
    <h1>生日记录</h1>
    <button class="btn yellow grow" type="button" id="addBtn" hidden>添加</button>
  </div>

  <section class="bench gate-box" id="passwordGate">
    <h2>输入密码</h2>
    <p class="hint">阴历、阳历、倒计时都在里面。</p>
    <form id="gateForm">
      <label class="field">
        <span>密码</span>
        <input type="password" id="passwordInput" maxlength="20" autocomplete="current-password">
      </label>
      <button class="btn ink" type="submit" id="loginBtn">进入</button>
      <p class="err" id="passwordError" role="alert"></p>
    </form>
  </section>

  <div id="mainApp" hidden>
    <form class="bench" id="addForm" hidden>
      <h2 id="formTitle">新记录</h2>
      <label class="field">
        <span>姓名</span>
        <input type="text" id="inputName" maxlength="30" placeholder="怎么称呼">
      </label>
      <div class="types" role="group" aria-label="历法">
        <button class="btn is-on" type="button" id="typeSolar" data-act="type" data-type="solar">阳历</button>
        <button class="btn" type="button" id="typeLunar" data-act="type" data-type="lunar">阴历</button>
      </div>
      <label class="field">
        <span id="dateLabel">阳历日期</span>
        <input type="date" id="inputDate">
      </label>
      <p class="preview" id="lunarPreview" hidden></p>
      <div class="actions">
        <button class="btn" type="button" id="cancelBtn">取消</button>
        <button class="btn ink" type="submit">保存</button>
      </div>
    </form>

    <div class="list" id="birthdayList"></div>
    <p class="empty" id="emptyState" hidden>还没有记录。点「添加」写一条。</p>
    <p class="loading" id="loadingState" hidden>加载中</p>
  </div>
</div>

<p class="toast" id="toast" role="status"></p>

<script>
(function () {
  var TOKEN_KEY = 'birthday_token';
  var API_BASE = '/api/birthdays';
  var LUNAR_MONTHS = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
  var LUNAR_DAYS = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

  var unlocked = false;
  var apiToken = localStorage.getItem(TOKEN_KEY) || '';
  var currentType = 'solar';
  var editingId = null;
  var birthdays = [];
  var toastTimer = 0;

  function $(id) { return document.getElementById(id); }
  function toast(msg, err) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.toggle('err', !!err);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove('show');
      el.textContent = '';
    }, 2200);
  }
  function showApp() {
    $('passwordGate').hidden = true;
    $('mainApp').hidden = false;
    $('addBtn').hidden = false;
  }
  function showGate() {
    $('passwordGate').hidden = false;
    $('mainApp').hidden = true;
    $('addBtn').hidden = true;
  }

  async function autoLogin() {
    var token = localStorage.getItem(TOKEN_KEY);
    if (!token) return;
    try {
      var res = await fetch(API_BASE, { headers: { 'x-api-token': token } });
      if (res.ok) {
        apiToken = token;
        unlocked = true;
        showApp();
        loadBirthdays();
      }
    } catch (err) {}
  }

  async function checkPassword() {
    var input = $('passwordInput');
    var error = $('passwordError');
    var btn = $('loginBtn');
    error.textContent = '';
    btn.disabled = true;
    btn.textContent = '核对中';
    try {
      var res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input.value })
      });
      var data = await res.json();
      if (res.ok && data.success) {
        unlocked = true;
        apiToken = data.token;
        localStorage.setItem(TOKEN_KEY, apiToken);
        input.value = '';
        showApp();
        loadBirthdays();
      } else if (data.locked) {
        error.textContent = '试得太多，过一会儿再来';
        input.value = '';
      } else {
        error.textContent = data.remaining != null ? '密码错了，还剩 ' + data.remaining + ' 次' : '密码错了';
        input.value = '';
        input.focus();
      }
    } catch (err) {
      error.textContent = '连不上，先确认服务开着';
    } finally {
      btn.disabled = false;
      btn.textContent = '进入';
    }
  }

  async function apiGet() {
    var res = await fetch(API_BASE, { headers: { 'x-api-token': apiToken } });
    if (res.status === 401) { toast('登录过期，刷新再进', true); return []; }
    if (!res.ok) throw new Error('读取失败');
    return res.json();
  }
  async function apiPost(data) {
    var res = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-token': apiToken },
      body: JSON.stringify(data)
    });
    if (res.status === 401) { toast('登录过期，刷新再进', true); return null; }
    if (!res.ok) throw new Error('保存失败');
    return res.json();
  }
  async function apiDelete(id) {
    var res = await fetch(API_BASE + '/' + id, {
      method: 'DELETE',
      headers: { 'x-api-token': apiToken }
    });
    if (res.status === 401) { toast('登录过期，刷新再进', true); return null; }
    if (!res.ok) throw new Error('删除失败');
    return res.json();
  }

  function setDateType(type) {
    currentType = type;
    $('typeSolar').classList.toggle('is-on', type === 'solar');
    $('typeLunar').classList.toggle('is-on', type === 'lunar');
    $('dateLabel').textContent = type === 'solar' ? '阳历日期' : '阴历日期';
    $('lunarPreview').hidden = true;
    updateLunarPreview();
  }

  function updateLunarPreview() {
    var dateVal = $('inputDate').value;
    var preview = $('lunarPreview');
    if (!dateVal || currentType === 'solar') { preview.hidden = true; return; }
    var parts = dateVal.split('-');
    if (parts.length !== 3) { preview.hidden = true; return; }
    var ly = parseInt(parts[0], 10);
    var lm = parseInt(parts[1], 10);
    var ld = parseInt(parts[2], 10);
    try {
      var result = solar2lunar.lunar2solar(ly, lm, ld, false);
      if (result) {
        var sd = result.cYear + '-' + String(result.cMonth).padStart(2, '0') + '-' + String(result.cDay).padStart(2, '0');
        preview.textContent = '农历 ' + ly + ' 年 ' + lm + ' 月 ' + ld + ' 日 → 公历 ' + sd;
        preview.hidden = false;
      } else {
        preview.hidden = true;
      }
    } catch (err) {
      preview.hidden = true;
    }
  }

  async function loadBirthdays() {
    try {
      $('loadingState').hidden = false;
      $('emptyState').hidden = true;
      $('birthdayList').replaceChildren();
      birthdays = await apiGet();
      $('loadingState').hidden = true;
      renderList();
    } catch (err) {
      $('loadingState').hidden = true;
      $('emptyState').hidden = false;
      $('emptyState').textContent = '加载失败，检查网络再试。';
      toast('加载失败', true);
    }
  }

  function showAddForm() {
    editingId = null;
    $('inputName').value = '';
    $('inputDate').value = '';
    setDateType('solar');
    $('lunarPreview').hidden = true;
    $('addForm').hidden = false;
    $('inputName').focus();
  }
  function hideAddForm() { $('addForm').hidden = true; }

  async function saveBirthday() {
    var name = $('inputName').value.trim();
    var dateVal = $('inputDate').value;
    if (!name) { toast('先写姓名', true); return; }
    if (!dateVal) { toast('先选日期', true); return; }
    var payload = { name: name, type: currentType, date: dateVal };
    if (currentType === 'lunar') {
      var parts = dateVal.split('-');
      payload.lunarYear = parseInt(parts[0], 10);
      payload.lunarMonth = parseInt(parts[1], 10);
      payload.lunarDay = parseInt(parts[2], 10);
    }
    try {
      if (editingId) {
        await apiDelete(editingId);
        await apiPost(payload);
        toast('已更新');
      } else {
        await apiPost(payload);
        toast('已添加');
      }
      hideAddForm();
      await loadBirthdays();
    } catch (err) {
      toast('保存失败', true);
    }
  }

  async function deleteBirthday(id) {
    if (!confirm('删除这条生日？')) return;
    try {
      await apiDelete(id);
      await loadBirthdays();
      toast('已删除');
    } catch (err) {
      toast('删除失败', true);
    }
  }

  function calcCountdown(bday) {
    var now = new Date();
    var currentYear = now.getFullYear();
    var targetDate = null;
    if (bday.lunarMonth && bday.lunarDay) {
      try {
        var result = solar2lunar.lunar2solar(currentYear, bday.lunarMonth, bday.lunarDay, false);
        if (result) {
          targetDate = new Date(result.cYear, result.cMonth - 1, result.cDay);
          if (targetDate < new Date(currentYear, now.getMonth(), now.getDate())) {
            result = solar2lunar.lunar2solar(currentYear + 1, bday.lunarMonth, bday.lunarDay, false);
            if (result) targetDate = new Date(result.cYear, result.cMonth - 1, result.cDay);
          }
        }
      } catch (err) {
        return { text: '--', isToday: false, isPast: false, diffMs: 0 };
      }
    } else {
      var parts = bday.date.split('-');
      targetDate = new Date(currentYear, parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      if (targetDate < new Date(currentYear, now.getMonth(), now.getDate())) {
        targetDate = new Date(currentYear + 1, parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      }
    }
    if (!targetDate) return { text: '--', isToday: false, isPast: false, diffMs: 0 };
    var diffMs = targetDate.getTime() - now.getTime();
    var isToday = targetDate.toDateString() === now.toDateString();
    if (isToday) return { text: '今天就是生日', isToday: true, isPast: false, diffMs: 0 };
    var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    var text = diffDays > 0 ? '还有 ' + diffDays + ' 天' : '不到 1 天';
    return { text: text, isToday: false, isPast: diffMs < 0, diffMs: diffMs };
  }

  function solarToLunar(year, month, day) {
    try {
      var r = solar2lunar.solar2lunar(year, month, day);
      return r ? { year: r.lYear, month: r.lMonth, day: r.lDay } : null;
    } catch (err) { return null; }
  }
  function lunarToSolar(year, month, day) {
    try {
      var r = solar2lunar.lunar2solar(year, month, day, false);
      return r ? r.cYear + '-' + String(r.cMonth).padStart(2, '0') + '-' + String(r.cDay).padStart(2, '0') : null;
    } catch (err) { return null; }
  }
  function fmtLunar(m, d) { return '农历' + (LUNAR_MONTHS[m - 1] || m) + '月' + (LUNAR_DAYS[d - 1] || d + '日'); }
  function fmtSolarShort(dateStr) {
    var p = dateStr.split('-');
    return '公历' + parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日';
  }
  function getSolarDate(b) {
    if (b.type === 'solar') return b.date;
    return lunarToSolar(b.lunarYear, b.lunarMonth, b.lunarDay);
  }
  function getLunarDate(b) {
    if (b.type === 'lunar' && b.lunarMonth && b.lunarDay) return { month: b.lunarMonth, day: b.lunarDay };
    var p = b.date.split('-');
    return solarToLunar(parseInt(p[0], 10), parseInt(p[1], 10), parseInt(p[2], 10));
  }
  function dualDateDisplay(b) {
    var solar = getSolarDate(b);
    var lunar = getLunarDate(b);
    var parts = [];
    if (solar) parts.push(fmtSolarShort(solar));
    if (lunar) parts.push(fmtLunar(lunar.month, lunar.day));
    return parts.join(' · ');
  }

  function renderList() {
    var container = $('birthdayList');
    var empty = $('emptyState');
    if (!birthdays.length) {
      container.replaceChildren();
      empty.hidden = false;
      empty.textContent = '还没有记录。点「添加」写一条。';
      return;
    }
    empty.hidden = true;
    var withCountdown = birthdays.map(function (b) { return { b: b, cd: calcCountdown(b) }; });
    withCountdown.sort(function (a, b) {
      if (a.cd.isToday) return -1;
      if (b.cd.isToday) return 1;
      if (a.cd.isPast && !b.cd.isPast) return 1;
      if (!a.cd.isPast && b.cd.isPast) return -1;
      return a.cd.diffMs - b.cd.diffMs;
    });
    container.replaceChildren();
    withCountdown.forEach(function (item) {
      var b = item.b;
      var cd = item.cd;
      var note = document.createElement('article');
      note.className = 'note';
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn red del';
      del.setAttribute('data-act', 'del');
      del.setAttribute('data-id', b.id);
      del.textContent = '删除';
      var name = document.createElement('h3');
      name.textContent = b.name;
      var dates = document.createElement('p');
      dates.className = 'dates';
      dates.textContent = dualDateDisplay(b);
      var count = document.createElement('p');
      count.className = 'countdown';
      if (cd.isToday) count.classList.add('today');
      else if (cd.isPast) count.classList.add('past');
      count.textContent = cd.text;
      note.appendChild(del);
      note.appendChild(name);
      note.appendChild(dates);
      note.appendChild(count);
      if (cd.diffMs > 0 && !cd.isToday) {
        var progress = Math.max(0, Math.min(100, (365 * 86400000 - cd.diffMs) / (365 * 86400000) * 100));
        var bar = document.createElement('div');
        bar.className = 'bar';
        bar.setAttribute('aria-hidden', 'true');
        var fill = document.createElement('i');
        fill.style.width = progress.toFixed(0) + '%';
        bar.appendChild(fill);
        note.appendChild(bar);
      }
      container.appendChild(note);
    });
  }

  $('gateForm').addEventListener('submit', function (event) {
    event.preventDefault();
    checkPassword();
  });
  $('addForm').addEventListener('submit', function (event) {
    event.preventDefault();
    saveBirthday();
  });
  $('addBtn').addEventListener('click', showAddForm);
  $('cancelBtn').addEventListener('click', hideAddForm);
  $('inputDate').addEventListener('change', updateLunarPreview);
  document.addEventListener('click', function (event) {
    var btn = event.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'type') setDateType(btn.getAttribute('data-type'));
    if (act === 'del') deleteBirthday(btn.getAttribute('data-id'));
  });

  setInterval(function () {
    if (unlocked && !$('mainApp').hidden) renderList();
  }, 60000);

  autoLogin();
  if (!apiToken) $('passwordInput').focus();
})();
</script>
</body>
