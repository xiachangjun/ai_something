<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大宝提醒日历</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        .header h1 {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        .folic { background: #ff6b6b; }
        .d3 { background: #4ecdc4; }
        .both { background: linear-gradient(135deg, #ff6b6b 50%, #4ecdc4 50%); }

        .calendar-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .month {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .month h2 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            font-size: 22px;
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            color: #666;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        .day {
            text-align: center;
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .day:hover {
            background: #f0f0f0;
        }
        .day.empty {
            cursor: default;
        }
        .day.empty:hover {
            background: transparent;
        }
        .day.today {
            background: #ffe66d;
            font-weight: bold;
        }
        .day.weekend {
            color: #888;
        }
        .day .marks {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
        }
        .day .mark {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .mark.folic { background: #ff6b6b; }
        .mark.d3 { background: #4ecdc4; }

        /* 移动端优化 */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .header h1 { font-size: 20px; }
            .legend { font-size: 12px; gap: 10px; }
            .calendar-container { grid-template-columns: 1fr; gap: 15px; }
            .month { padding: 15px; }
            .month h2 { font-size: 18px; margin-bottom: 10px; }
            .weekdays { font-size: 13px; }
            .days { gap: 2px; }
            .day { padding: 10px 2px; font-size: 15px; border-radius: 4px; }
        }
        @media (max-width: 400px) {
            .month { padding: 10px; }
            .month h2 { font-size: 16px; }
            .day { padding: 8px 1px; font-size: 13px; }
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            max-width: 300px;
        }
        .modal-content h3 { margin-bottom: 15px; color: #333; }
        .modal-content p { margin-bottom: 15px; color: #666; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: white;
            transition: transform 0.2s;
            flex: 1;
            min-width: 80px;
        }
        .modal-btn:hover { transform: scale(1.05); }
        .modal-btn.folic { background: #ff6b6b; }
        .modal-btn.d3 { background: #4ecdc4; }
        .modal-btn.both { background: #4a90d9; }
        .modal-btn.none { background: #ffb6c1; }
        .modal-btn.cancel { background: #ffb6c1; margin-top: 10px; width: 100%; flex: none; }
        .btn-row { display: flex; gap: 10px; width: 100%; }
    </style>
</head>
<body>
    <div class="header">
        <h1>大宝提醒日历</h1>
        <div class="legend">
            <div class="legend-item"><div class="legend-dot folic"></div> 叶酸(每天)</div>
            <div class="legend-item"><div class="legend-dot d3"></div> 维D3(每两天)</div>
            <div class="legend-item"><div class="legend-dot both"></div> 都吃</div>
        </div>
    </div>
    <div class="calendar-container" id="calendar"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modal-date"></h3>
            <p id="modal-hint"></p>
            <div class="modal-buttons">
                <div class="btn-row">
                    <button class="modal-btn folic" onclick="setMedicine('folic')">叶酸</button>
                    <button class="modal-btn d3" onclick="setMedicine('d3')">维D3</button>
                </div>
                <div class="btn-row">
                    <button class="modal-btn both" onclick="setMedicine('both')">都吃了</button>
                    <button class="modal-btn none" onclick="setMedicine('none')">都没吃</button>
                </div>
                <button class="modal-btn cancel" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 维生素D3第一次日期: 2026年6月14日
        const VD3_FIRST_DATE = new Date(2026, 5, 14);

        const months = [
            { year: 2026, month: 6, name: '六月' },
            { year: 2026, month: 7, name: '七月' },
            { year: 2026, month: 8, name: '八月' },
            { year: 2026, month: 9, name: '九月' },
            { year: 2026, month: 10, name: '十月' },
            { year: 2026, month: 11, name: '十一月' },
            { year: 2026, month: 12, name: '十二月' },
            { year: 2027, month: 1, name: '一月' },
            { year: 2027, month: 2, name: '二月' },
            { year: 2027, month: 3, name: '三月' }
        ];

        const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        // 从localStorage读取记录
        let records = JSON.parse(localStorage.getItem('medicineRecords') || '{}');

        // 保存记录
        function saveRecords() {
            localStorage.setItem('medicineRecords', JSON.stringify(records));
        }

        // 获取某日期应该吃哪些药(根据规则计算)
        function getExpectedMeds(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);

            // 叶酸: 每天都要吃
            const folic = true;

            // 维D3: 从6月14号开始，每两天吃一次
            const daysDiff = Math.floor((d - VD3_FIRST_DATE) / (1000 * 60 * 60 * 24));
            const d3 = daysDiff >= 0 && daysDiff % 2 === 0;

            return { folic, d3 };
        }

        // 判断记录是否符合预期
        function checkRecord(dateStr, record) {
            const expected = getExpectedMeds(new Date(dateStr));
            if (record === 'folic') return expected.folic && !expected.d3;
            if (record === 'd3') return !expected.folic && expected.d3;
            if (record === 'both') return expected.folic && expected.d3;
            if (record === 'none') return !expected.folic && !expected.d3;
            return false;
        }

        let currentDate = null;

        function openModal(year, month, day) {
            currentDate = `${year}-${month}-${day}`;
            document.getElementById('modal-date').textContent = `${year}年${month}月${day}日`;

            // 根据日期判断应该吃什么药
            const date = new Date(year, month - 1, day);
            const expected = getExpectedMeds(date);
            let hint = '';
            if (expected.folic && expected.d3) {
                hint = '今天要吃叶酸和维D3';
            } else if (expected.folic) {
                hint = '今天要吃叶酸';
            } else if (expected.d3) {
                hint = '今天要吃维D3';
            } else {
                hint = '今天不用吃药';
            }
            document.getElementById('modal-hint').textContent = hint;

            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            currentDate = null;
        }

        function setMedicine(type) {
            if (currentDate) {
                records[currentDate] = type;
                saveRecords();
                renderCalendar();
            }
            closeModal();
        }

        function renderCalendar() {
            const container = document.getElementById('calendar');
            container.innerHTML = '';

            months.forEach(({ year, month, name }) => {
                const firstDay = new Date(year, month - 1, 1);
                const lastDay = new Date(year, month, 0);
                const startWeekday = firstDay.getDay();
                const totalDays = lastDay.getDate();

                let html = `
                    <div class="month">
                        <h2>${year}年 ${name}</h2>
                        <div class="weekdays">
                            ${weekdays.map(d => `<div>${d}</div>`).join('')}
                        </div>
                        <div class="days">
                `;

                // Empty cells
                for (let i = 0; i < startWeekday; i++) {
                    html += '<div class="day empty"></div>';
                }

                // Days
                for (let day = 1; day <= totalDays; day++) {
                    const date = new Date(year, month - 1, day);
                    const dateStr = `${year}-${month}-${day}`;
                    const isToday = date.getTime() === today.getTime();
                    const isWeekend = (startWeekday + day - 1) % 7 === 0 || (startWeekday + day - 1) % 7 === 6;
                    const isFuture = date > today;

                    let classes = ['day'];
                    if (isToday) classes.push('today');
                    if (isWeekend && !isToday) classes.push('weekend');
                    if (isFuture) classes.push('future');

                    let marks = '';
                    const record = records[dateStr];

                    if (record) {
                        if (record === 'folic') marks = '<div class="marks"><div class="mark folic"></div></div>';
                        else if (record === 'd3') marks = '<div class="marks"><div class="mark d3"></div></div>';
                        else if (record === 'both') marks = '<div class="marks"><div class="mark folic"></div><div class="mark d3"></div></div>';
                    }

                    const clickHandler = isFuture ? '' : `onclick="openModal(${year}, ${month}, ${day})"`;
                    html += `<div class="${classes.join(' ')}" ${clickHandler}>${day}${marks}</div>`;
                }

                html += '</div></div>';
                container.innerHTML += html;
            });
        }

        renderCalendar();
    </script>
</body>
</html>
